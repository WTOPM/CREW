<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>02 - Port of Call - Security</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="../port-of-call-pdf-common.css" />
  <link rel="stylesheet" href="../port-of-call-editor.css" />
  <link rel="stylesheet" href="../cell-align-toolbar.css" />
  <link rel="stylesheet" href="../overlay-toolbar.css" />
  <link rel="stylesheet" href="port-of-call-form-02.css" />
  <link rel="stylesheet" href="../html-form-editor-chrome.css" />
</head>
<body class="poc-editor">
  <div class="side-panel side-panel--left">
    <div class="side-panel__actions">
      <button type="button" class="btn btn-save" onclick="persistAllChanges()">
        <svg class="side-panel__ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5 9.5 17 19 7.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Save
      </button>
      <button type="button" class="btn btn-cancel" onclick="showConfirmModal()">
        <svg class="side-panel__ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 8l8 8M16 8l-8 8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        Cancel
      </button>
    </div>
    <section class="side-panel__section">
      <h2 class="side-panel__heading">Format</h2>
      <select id="tb-font" class="side-panel__select" onchange="applyFormat('fontFamily', this.value)">
        <option value="Arial">Arial</option>
        <option value="Calibri">Calibri</option>
        <option value="Times New Roman">Times New Roman</option>
        <option value="Courier New">Courier New</option>
      </select>
      <select id="tb-size" class="side-panel__select" onchange="applyFormat('fontSize', this.value + 'pt')">
        <option value="6">6</option>
        <option value="7">7</option>
        <option value="8" selected>8</option>
        <option value="9">9</option>
        <option value="10">10</option>
      </select>
      <div id="cell-align-toolbar" class="cell-align-toolbar" aria-label="Cell alignment"></div>
    </section>
    <section class="side-panel__section">
      <h2 class="side-panel__heading">Zoom</h2>
      <div class="zoom-controls">
        <div class="zoom-controls__row">
          <button type="button" class="zoom-controls__btn" onclick="zoomStep(-1)" title="Zoom out" aria-label="Zoom out">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
          </button>
          <span id="zoom-label" class="zoom-controls__pct">100%</span>
          <button type="button" class="zoom-controls__btn" onclick="zoomStep(1)" title="Zoom in" aria-label="Zoom in">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6v12M6 12h12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
          </button>
        </div>
      </div>
    </section>
  </div>

  <div class="doc-zoom-viewport" id="doc-zoom-viewport">
    <div class="doc-zoom-pad" id="doc-zoom-pad">
      <nav id="poc-page-nav" class="poc-page-nav" hidden aria-label="Document pages">
        <button type="button" id="poc-page-prev" class="poc-page-nav__btn" title="Previous page" aria-label="Previous page">
          <svg class="poc-page-nav__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="poc-page-nav__center">
          <span class="poc-page-nav__prefix">Page</span>
          <input type="text" id="poc-page-input" class="poc-page-nav__input" inputmode="numeric" autocomplete="off" spellcheck="false" aria-label="Current page number" value="1" />
          <span class="poc-page-nav__sep" aria-hidden="true">/</span>
          <span id="poc-page-total" class="poc-page-nav__total">1</span>
        </div>
        <button type="button" id="poc-page-next" class="poc-page-nav__btn" title="Next page" aria-label="Next page">
          <svg class="poc-page-nav__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 5.5 16 12l-6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </nav>
      <div class="doc-zoom-slot" id="doc-zoom-slot">
        <div class="doc-zoom-stage" id="doc-zoom-stage">
          <div id="poc-pages" class="poc-pages"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="side-panel side-panel--right">
    <section class="side-panel__section">
      <h2 class="side-panel__heading">Rows</h2>
      <button type="button" id="btn-add-row" class="btn btn-s side-panel__row-btn" onclick="addRow()"><svg class="side-panel__ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6v12M6 12h12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg> Add row</button>
      <button type="button" id="btn-remove-row" class="btn btn-s side-panel__row-btn side-panel__row-btn--muted" onclick="removeRow()"><svg class="side-panel__ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg> Remove last</button>
    </section>
    <section class="side-panel__section">
      <h2 class="side-panel__heading">Overlays</h2>
      <div class="overlay-toolbar" aria-label="Stamp and signature">
        <div id="overlay-toolbar-toggles" class="overlay-toolbar__toggles" role="group" aria-label="Overlays"></div>
        <button type="button" class="btn btn-s btn--compact overlay-toolbar__reset" onclick="resetPositions()">Reset positions</button>
      </div>
    </section>
  </div>

  <div id="confirm-modal" class="confirm-backdrop" style="display: none;" onclick="if (event.target === this) closeConfirmModal()">
    <div class="dg-archive-modal confirm-dialog confirm-dialog--danger" role="alertdialog" aria-modal="true"
      aria-labelledby="confirm-dialog-title" aria-describedby="confirm-dialog-message" onclick="event.stopPropagation()">
      <header class="dg-archive-modal__head">
        <div class="dg-archive-modal__icon confirm-dialog__icon confirm-dialog__icon--danger" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
            <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
          </svg>
        </div>
        <div class="dg-archive-modal__intro">
          <h3 id="confirm-dialog-title">Cancel changes</h3>
          <p id="confirm-dialog-message" class="confirm-dialog__message">Are you sure you want to cancel? All unsaved changes will be lost.</p>
        </div>
      </header>
      <footer class="dg-archive-modal__foot">
        <button type="button" class="btn btn-secondary" onclick="closeConfirmModal()">Cancel</button>
        <button type="button" class="btn btn-danger" onclick="confirmCancel()">Discard changes</button>
      </footer>
    </div>
  </div>

  <script src="../overlay-drag.js"></script>
  <script src="../html-form-editor-dirty.js"></script>
  <script src="../html-form-date-format.js"></script>
  <script src="../html-form-footer-fields.js"></script>
  <script src="../html-form-editor-wheel.js"></script>
  <script src="../cell-align-toolbar.js"></script>
  <script src="../overlay-toolbar.js"></script>
  <script src="../html-form-pdf-snapshot.js"></script>
  <script src="../crew-name-format.js"></script>
  <script src="../port-of-call-pdf-common.js"></script>
  <script src="../port-of-call-form-editor.js"></script>
  <script src="../port-of-call-form-rows.js"></script>
  <script src="../port-of-call-form-pages.js"></script>
  <script src="../port-of-call-form-cells.js"></script>
  <script src="port-of-call-form-02.js"></script>
</body>
</html>
