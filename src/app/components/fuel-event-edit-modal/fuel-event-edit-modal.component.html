<div class="modal-backdrop fuel-event-backdrop">
  <div
    class="modal fuel-event-modal"
    appClickOutside
    (appClickOutside)="cancel.emit()"
    (click)="$event.stopPropagation()"
    role="dialog"
    aria-modal="true"
    aria-labelledby="fuel-event-modal-title"
  >
    <header class="fuel-event-modal__head">
      <div class="fuel-event-modal__head-main">
        <h3 id="fuel-event-modal-title">Add fuel event</h3>
        <span class="fuel-event-kind" [attr.data-kind]="draft().kind">{{ kindLabels[draft().kind] }}</span>
      </div>
      <p class="fuel-event-modal__hint">{{ autoHint() }}</p>
    </header>

    <div class="fuel-event-modal__body">
      <section class="fuel-event-section">
        <h4 class="fuel-event-section__title">When</h4>
        <div class="fuel-event-grid fuel-event-grid--3">
          <label class="fuel-event-field">
            <span class="fuel-event-field__label">Date</span>
            <app-date-picker [value]="draft().date" (valueChange)="updateField('date', $event)" />
          </label>
          <label class="fuel-event-field">
            <span class="fuel-event-field__label">Time</span>
            <div class="fuel-event-time-row">
              <app-time-input
                class="fuel-event-time"
                [value]="draft().time"
                (valueChange)="updateField('time', $event)"
              />
              <button
                type="button"
                class="fuel-event-time-now"
                title="Set date &amp; time to now"
                (click)="setNow()"
              >
                Now
              </button>
            </div>
          </label>
          <label class="fuel-event-field">
            <span class="fuel-event-field__label">Hrs {{ hoursAsHm() ? '(H:MM)' : '' }}</span>
            <input
              class="fuel-event-field__control fuel-event-field__control--ro"
              [value]="hoursDisplay() || '—'"
              readonly
              tabindex="-1"
              [title]="previous() ? 'Hours since previous event (auto)' : 'No previous event — hours unknown'"
            />
          </label>
        </div>
      </section>

      <section class="fuel-event-section">
        <h4 class="fuel-event-section__title">Where &amp; event</h4>
        <div class="fuel-event-grid fuel-event-grid--2">
          <label class="fuel-event-field">
            <span class="fuel-event-field__label">Place</span>
            <select
              class="fuel-event-field__control"
              [ngModel]="draft().place"
              (ngModelChange)="updateField('place', $event)"
            >
              <option value="">— select place —</option>
              @for (place of placeOptions(); track place) {
                <option [value]="place">{{ place }}</option>
              }
            </select>
          </label>

          <label class="fuel-event-field">
            <span class="fuel-event-field__label">Excel event</span>
            @if (!customEvent()) {
              <select
                class="fuel-event-field__control"
                [ngModel]="draft().rawEvent"
                (ngModelChange)="onRawEventPick($event)"
              >
                <option value="">— select event —</option>
                @for (opt of eventOptions; track opt) {
                  <option [value]="opt">{{ opt }}</option>
                }
                <option value="__custom__">Custom…</option>
              </select>
            } @else {
              <div class="fuel-event-custom-row">
                <input
                  class="fuel-event-field__control"
                  [ngModel]="draft().rawEvent"
                  (ngModelChange)="updateField('rawEvent', $event)"
                  placeholder="Excel event text"
                />
                <button type="button" class="fuel-event-link-btn" (click)="backToEventList()">List</button>
              </div>
            }
          </label>
        </div>
      </section>

      <section class="fuel-event-section fuel-event-section--fuel">
        <div class="fuel-event-section__head">
          <h4 class="fuel-event-section__title">Fuel (mt)</h4>
          <button type="button" class="fuel-event-recalc" (click)="recalc()" title="Recalculate hours and ROB from previous event">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path
                fill="currentColor"
                d="M12 6V3L8 7l4 4V8c2.76 0 5 2.24 5 5a5 5 0 0 1-8.9 3.1L6.7 17.5A7 7 0 0 0 19 13c0-3.87-3.13-7-7-7zm-7 7c0-1.34.38-2.59 1.03-3.66l1.42 1.42A4.96 4.96 0 0 0 7 13c0 2.76 2.24 5 5 5v3l4-4-4-4v3c-2.76 0-5-2.24-5-5z"
              />
            </svg>
            Recalculate
          </button>
        </div>
        <div class="fuel-event-grid fuel-event-grid--3">
          <div class="fuel-event-field">
            <span class="fuel-event-field__label">ME t</span>
            <div class="fuel-event-mt-row">
              <input
                class="fuel-event-field__control"
                [ngModel]="draft().meMt ?? ''"
                (ngModelChange)="onNum('meMt', $event)"
                (keydown)="onMtArrow($event, 'meMt')"
                inputmode="decimal"
                placeholder="0.0"
                title="↑↓ ±0.1"
              />
              <div class="fuel-event-mt-steps" aria-hidden="true">
                <button type="button" class="fuel-event-mt-step" tabindex="-1" title="+0.1" (mousedown)="$event.preventDefault()" (click)="nudgeMt('meMt', 1)">▲</button>
                <button type="button" class="fuel-event-mt-step" tabindex="-1" title="−0.1" (mousedown)="$event.preventDefault()" (click)="nudgeMt('meMt', -1)">▼</button>
              </div>
            </div>
            <label class="fuel-event-rob-pick">
              <span class="fuel-event-rob-pick__label">from ROB</span>
              <select
                class="fuel-event-rob-pick__select"
                [ngModel]="draft().meRobTank ?? ''"
                (ngModelChange)="onRobTank('meRobTank', $event)"
                [title]="draft().meRobTank ? robTankTips[draft().meRobTank!] : 'ROB tank for ME'"
              >
                @for (tank of robTanks(); track tank) {
                  <option [value]="tank" [title]="robTankTips[tank]">{{ robTankLabels[tank] }}</option>
                }
              </select>
            </label>
          </div>
          <div class="fuel-event-field">
            <span class="fuel-event-field__label">AE t</span>
            <div class="fuel-event-mt-row">
              <input
                class="fuel-event-field__control"
                [ngModel]="draft().aeMt ?? ''"
                (ngModelChange)="onNum('aeMt', $event)"
                (keydown)="onMtArrow($event, 'aeMt')"
                inputmode="decimal"
                placeholder="0.0"
                title="↑↓ ±0.1"
              />
              <div class="fuel-event-mt-steps" aria-hidden="true">
                <button type="button" class="fuel-event-mt-step" tabindex="-1" title="+0.1" (mousedown)="$event.preventDefault()" (click)="nudgeMt('aeMt', 1)">▲</button>
                <button type="button" class="fuel-event-mt-step" tabindex="-1" title="−0.1" (mousedown)="$event.preventDefault()" (click)="nudgeMt('aeMt', -1)">▼</button>
              </div>
            </div>
            <label class="fuel-event-rob-pick">
              <span class="fuel-event-rob-pick__label">from ROB</span>
              <select
                class="fuel-event-rob-pick__select"
                [ngModel]="draft().aeRobTank ?? ''"
                (ngModelChange)="onRobTank('aeRobTank', $event)"
                [title]="draft().aeRobTank ? robTankTips[draft().aeRobTank!] : 'ROB tank for AE'"
              >
                @for (tank of robTanks(); track tank) {
                  <option [value]="tank" [title]="robTankTips[tank]">{{ robTankLabels[tank] }}</option>
                }
              </select>
            </label>
          </div>
          <div class="fuel-event-field">
            <span class="fuel-event-field__label">DMA / Boiler t</span>
            <div class="fuel-event-mt-row">
              <input
                class="fuel-event-field__control"
                [ngModel]="draft().boilerMt ?? ''"
                (ngModelChange)="onNum('boilerMt', $event)"
                (keydown)="onMtArrow($event, 'boilerMt')"
                inputmode="decimal"
                placeholder="0.0"
                title="↑↓ ±0.1"
              />
              <div class="fuel-event-mt-steps" aria-hidden="true">
                <button type="button" class="fuel-event-mt-step" tabindex="-1" title="+0.1" (mousedown)="$event.preventDefault()" (click)="nudgeMt('boilerMt', 1)">▲</button>
                <button type="button" class="fuel-event-mt-step" tabindex="-1" title="−0.1" (mousedown)="$event.preventDefault()" (click)="nudgeMt('boilerMt', -1)">▼</button>
              </div>
            </div>
            <label class="fuel-event-rob-pick">
              <span class="fuel-event-rob-pick__label">from ROB</span>
              <select
                class="fuel-event-rob-pick__select"
                [ngModel]="draft().boilerRobTank ?? ''"
                (ngModelChange)="onRobTank('boilerRobTank', $event)"
                [title]="draft().boilerRobTank ? robTankTips[draft().boilerRobTank!] : 'ROB tank for DMA/Boiler'"
              >
                @for (tank of robTanks(); track tank) {
                  <option [value]="tank" [title]="robTankTips[tank]">{{ robTankLabels[tank] }}</option>
                }
              </select>
            </label>
          </div>
        </div>
        <div class="fuel-event-rob-row" [style.grid-template-columns]="'repeat(' + robChips().length + ', minmax(0, 1fr))'">
          @for (chip of robChips(); track chip.tank) {
            <div class="fuel-event-field fuel-event-field--rob" [class.fuel-event-field--rob-empty]="chip.empty">
              <span class="fuel-event-field__label">{{ chip.label }}</span>
              <output class="fuel-event-field__control fuel-event-field__control--ro" [title]="chip.title">
                {{ fmtRob(chip.value) }}
              </output>
            </div>
          }
        </div>
      </section>
    </div>

    <footer class="fuel-event-modal__actions">
      <button type="button" class="btn btn-secondary" (click)="cancel.emit()">Cancel</button>
      <button
        type="button"
        class="btn btn-primary fuel-event-add-btn"
        (click)="submit()"
        [disabled]="!draft().date || (!draft().rawEvent && !draft().place)"
      >
        Add event
      </button>
    </footer>
  </div>
</div>
