<div
  class="modal-backdrop ad-fname-backdrop"
  (mousedown)="onBackdrop($event)"
  role="presentation"
>
  <div
    class="modal ad-fname-modal"
    role="dialog"
    aria-modal="true"
    aria-label="Auto Excel name"
    (mousedown)="$event.stopPropagation()"
  >
    <header class="ad-fname-modal__head">
      <h3 class="ad-fname-modal__title">Auto Excel name</h3>
    </header>

    <div class="ad-fname-blocks">
      @for (block of edit().blocks; track trackBlock($index, block); let i = $index; let last = $last) {
        <div class="ad-fname-row">
          <select
            class="ad-fname-type"
            [ngModel]="block.type"
            (ngModelChange)="setBlockType(block.id, $event)"
            aria-label="Block"
          >
            @for (opt of blockTypes; track opt.type) {
              <option [value]="opt.type">{{ opt.label }}</option>
            }
          </select>

          @if (block.type === 'custom') {
            <input
              class="ad-fname-text"
              type="text"
              maxlength="64"
              autocomplete="off"
              spellcheck="false"
              placeholder="Text"
              [ngModel]="block.text"
              (ngModelChange)="setBlockText(block.id, $event)"
            />
          } @else {
            <span class="ad-fname-spacer" aria-hidden="true"></span>
          }

          @if (!last) {
            <input
              class="ad-fname-sep"
              type="text"
              maxlength="8"
              autocomplete="off"
              spellcheck="false"
              title="Separator after this block"
              aria-label="Separator"
              [ngModel]="block.sepAfter"
              (ngModelChange)="setBlockSep(block.id, $event)"
              placeholder=" "
            />
          } @else {
            <span class="ad-fname-sep-slot" aria-hidden="true"></span>
          }

          <div class="ad-fname-ops">
            <button
              type="button"
              class="ad-fname-icon-btn"
              title="Up"
              aria-label="Move up"
              [disabled]="i === 0"
              (click)="moveBlock(block.id, -1)"
            >
              ▲
            </button>
            <button
              type="button"
              class="ad-fname-icon-btn"
              title="Down"
              aria-label="Move down"
              [disabled]="last"
              (click)="moveBlock(block.id, 1)"
            >
              ▼
            </button>
            <button
              type="button"
              class="ad-fname-icon-btn ad-fname-icon-btn--danger"
              title="Remove"
              aria-label="Remove"
              (click)="removeBlock(block.id)"
            >
              ✕
            </button>
          </div>
        </div>
      }
    </div>

    <button type="button" class="btn ad-fname-add" (click)="addBlock()">+ Add</button>

    <div class="ad-fname-preview" aria-live="polite">
      <span class="ad-fname-preview__label">Preview</span>
      <code class="ad-fname-preview__value">{{ previewName() }}</code>
    </div>

    <div class="modal-actions ad-fname-actions">
      <button type="button" class="btn btn-secondary" (click)="cancel.emit()">Cancel</button>
      <button type="button" class="btn btn-primary" (click)="apply()">Apply</button>
    </div>
  </div>
</div>
