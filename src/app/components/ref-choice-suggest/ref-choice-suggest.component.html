<div class="rcs" cdkOverlayOrigin #origin="cdkOverlayOrigin">
  @if (multiline()) {
    <textarea
      #filterInput
      rows="1"
      autocomplete="off"
      spellcheck="false"
      [class]="inputClass()"
      [class.dg-cell-input--await-input]="awaiting()"
      [class.dg-cell-input--readonly]="readonly()"
      [readonly]="readonly()"
      [attr.title]="title()"
      [attr.tabindex]="readonly() ? -1 : 0"
      [ngModel]="draft()"
      (ngModelChange)="onDraftChange($event)"
      (mousedown)="onMouseDown($event)"
      (focus)="onFocus()"
      (blur)="onBlur()"
      (keydown)="onKeydown($event)"
    ></textarea>
  } @else {
    <input
      #filterInput
      type="text"
      autocomplete="off"
      spellcheck="false"
      [class]="inputClass()"
      [class.dg-cell-input--await-input]="awaiting()"
      [class.dg-cell-input--readonly]="readonly()"
      [readonly]="readonly()"
      [attr.title]="title()"
      [attr.tabindex]="readonly() ? -1 : 0"
      [ngModel]="draft()"
      (ngModelChange)="onDraftChange($event)"
      (mousedown)="onMouseDown($event)"
      (focus)="onFocus()"
      (blur)="onBlur()"
      (keydown)="onKeydown($event)"
    />
  }
</div>

<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="origin"
  [cdkConnectedOverlayOpen]="panelOpen()"
  [cdkConnectedOverlayPositions]="overlayPositions"
  [cdkConnectedOverlayPush]="true"
  [cdkConnectedOverlayViewportMargin]="8"
  [cdkConnectedOverlayWidth]="overlayWidth()"
  [cdkConnectedOverlayPanelClass]="'rcs-overlay-panel'"
  (overlayOutsideClick)="onOverlayOutsideClick()"
>
  <ul
    #panel
    class="rcs__list"
    [class.rcs__list--fuel]="listTone() === 'fuel'"
    role="listbox"
  >
    @for (opt of filtered(); track opt; let i = $index) {
      <li
        class="rcs__option"
        role="option"
        [class.rcs__option--selected]="opt === draft()"
        [class.rcs__option--active]="i === activeIndex()"
        (mousedown)="pick(opt, $event)"
        (mouseenter)="activeIndex.set(i)"
      >
        {{ opt }}
      </li>
    }
  </ul>
</ng-template>
