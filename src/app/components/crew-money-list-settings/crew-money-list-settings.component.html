<section class="doc-form-settings">
  <p class="doc-hint">
    Crew from arrival list (home page order). Ship name and nationality come from ship data.
  </p>

  <h4 class="doc-section-title">Per-crew amounts</h4>
  <ul class="doc-crew-list">
    @for (member of crew(); track member.id) {
      <li class="doc-crew-row">
        <span class="doc-crew-name">{{ crewLabel(member) }}</span>
        <label class="doc-field">
          <span class="doc-label">USD</span>
          <input
            type="text"
            class="doc-input"
            [ngModel]="amountsFor(form(), member.id).usd"
            (ngModelChange)="onAmountChange(member.id, 'usd', $event)"
          />
        </label>
        <label class="doc-field">
          <span class="doc-label">EURO</span>
          <input
            type="text"
            class="doc-input"
            [ngModel]="amountsFor(form(), member.id).euro"
            (ngModelChange)="onAmountChange(member.id, 'euro', $event)"
          />
        </label>
        <label class="doc-field">
          <span class="doc-label">Others</span>
          <input
            type="text"
            class="doc-input"
            [ngModel]="amountsFor(form(), member.id).others"
            (ngModelChange)="onAmountChange(member.id, 'others', $event)"
          />
        </label>
      </li>
    }
  </ul>

  <app-document-stamp-options documentId="crewMoney" />
</section>
