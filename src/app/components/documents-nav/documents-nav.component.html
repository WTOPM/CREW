@if (showPortOfCallSettings()) {
  <div class="modal-backdrop" (click)="closePortOfCallSettings()">
    <div class="modal modal-wide poc-modal" (click)="$event.stopPropagation()">
      <h3>Port of Call Settings</h3>
      <div class="poc-settings-bar">
        <label>
          <span>Ports in PDF</span>
          <input
            type="number"
            [min]="pocMinPorts"
            [max]="pocMaxPorts"
            [ngModel]="portOfCall().pdfRowCount"
            (ngModelChange)="onPdfPortCountChange($event)"
          />
        </label>
        <button type="button" class="btn btn-primary" (click)="addPortCallRow()">+ Add port call</button>
      </div>
      <div class="table-wrap poc-history-wrap">
        <table class="poc-history-table">
          <thead>
            <tr>
              <th>Port</th>
              <th>Country</th>
              <th>Arr. date</th>
              <th>Arr. time</th>
              <th>Dep. date</th>
              <th>Dep. time</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            @for (row of portCallHistory(); track row.id) {
              <tr>
                <td>
                  <app-port-select
                    [value]="row.portName"
                    [ports]="ports()"
                    (valueChange)="onPortCallPortChange(row.id, $event)"
                  />
                </td>
                <td>
                  <input
                    [ngModel]="row.country"
                    (ngModelChange)="updatePortCallField(row.id, 'country', $event)"
                    placeholder="ITALY"
                  />
                </td>
                <td>
                  <app-partial-date-input
                    [value]="row.arrivalDate"
                    (valueChange)="updatePortCallField(row.id, 'arrivalDate', $event)"
                  />
                </td>
                <td>
                  <app-time-input
                    [value]="row.arrivalTime"
                    (valueChange)="updatePortCallField(row.id, 'arrivalTime', $event)"
                  />
                </td>
                <td>
                  <app-partial-date-input
                    [value]="row.departureDate"
                    (valueChange)="updatePortCallField(row.id, 'departureDate', $event)"
                  />
                </td>
                <td>
                  <app-time-input
                    [value]="row.departureTime"
                    (valueChange)="updatePortCallField(row.id, 'departureTime', $event)"
                  />
                </td>
                <td class="actions">
                  <button type="button" class="btn-link warn" (click)="removePortCallRow(row.id)">×</button>
                </td>
              </tr>
            }
          </tbody>
        </table>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-primary" (click)="closePortOfCallSettings()">Done</button>
      </div>
    </div>
  </div>
}
