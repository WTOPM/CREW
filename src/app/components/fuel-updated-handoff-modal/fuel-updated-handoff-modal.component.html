<div class="modal-backdrop fuel-upd-backdrop" (click)="cancel()">
  <div
    class="modal fuel-upd-modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="fuel-upd-title"
    (click)="$event.stopPropagation()"
  >
    <header class="fuel-upd-modal__head">
      <div class="fuel-upd-modal__intro">
        <h3 id="fuel-upd-title">UPDATED</h3>
        <p>
          @if (isView()) {
            View: request update (red) with date &amp; port · check Edit’s parameter list
          } @else {
            Edit: fill values and mark Done (green) when complete
          }
        </p>
      </div>
      <button type="button" class="btn btn-secondary btn-sm" (click)="cancel()">Close</button>
    </header>

    <div class="fuel-upd-modal__body">
      <div class="fuel-upd-status" [attr.data-status]="draft().status">
        <span class="fuel-upd-status__label">Status</span>
        <strong>{{ statusLabel() }}</strong>
        <div class="fuel-upd-status__actions">
          @if (isView()) {
            <button
              type="button"
              class="fuel-upd-pill fuel-upd-pill--need"
              [class.fuel-upd-pill--on]="draft().status === 'needs_update'"
              (click)="setStatus('needs_update')"
            >
              Needs update
            </button>
            <button
              type="button"
              class="fuel-upd-pill"
              [class.fuel-upd-pill--on]="draft().status === 'idle'"
              (click)="setStatus('idle')"
            >
              Clear
            </button>
          }
          @if (isEdit()) {
            <button
              type="button"
              class="fuel-upd-pill fuel-upd-pill--done"
              [class.fuel-upd-pill--on]="draft().status === 'done'"
              (click)="setStatus('done')"
            >
              Done
            </button>
            <button
              type="button"
              class="fuel-upd-pill fuel-upd-pill--need"
              [class.fuel-upd-pill--on]="draft().status === 'needs_update'"
              (click)="setStatus('needs_update')"
            >
              Needs update
            </button>
            <button
              type="button"
              class="fuel-upd-pill"
              [class.fuel-upd-pill--on]="draft().status === 'idle'"
              (click)="setStatus('idle')"
            >
              Clear
            </button>
          }
        </div>
      </div>

      <div class="fuel-upd-meta">
        <label class="fuel-upd-field">
          <span>Date</span>
          <app-date-picker size="sm" [value]="draft().date" (valueChange)="onDate($event)" />
        </label>
        <label class="fuel-upd-field fuel-upd-field--port">
          <span>Port</span>
          <input
            type="text"
            list="fuel-upd-ports"
            [ngModel]="draft().port"
            (ngModelChange)="patchDraft({ port: $event })"
            placeholder="Port / place"
          />
          <datalist id="fuel-upd-ports">
            @for (p of placeChoices(); track p) {
              <option [value]="p"></option>
            }
          </datalist>
        </label>
      </div>

      <label class="fuel-upd-field fuel-upd-field--note">
        <span>Note</span>
        <input
          type="text"
          [ngModel]="draft().note"
          (ngModelChange)="patchDraft({ note: $event })"
          placeholder="Optional note"
        />
      </label>

      <div class="fuel-upd-list-head">
        <h4>Parameters</h4>
        <div class="fuel-upd-list-head__actions">
          <button type="button" class="btn btn-secondary btn-sm" (click)="seedFromMaster()">
            From S1–AC4
          </button>
          <button type="button" class="btn btn-secondary btn-sm" (click)="addItem()">Add row</button>
        </div>
      </div>

      <div class="fuel-upd-list">
        @for (item of draft().items; track item.id) {
          <div class="fuel-upd-row">
            <input
              class="fuel-upd-row__label"
              [ngModel]="item.label"
              (ngModelChange)="patchItem(item.id, { label: $event })"
              placeholder="Label"
            />
            <input
              class="fuel-upd-row__value"
              [ngModel]="item.value"
              (ngModelChange)="patchItem(item.id, { value: $event })"
              [placeholder]="isEdit() ? 'Fill value' : 'Value from Edit'"
            />
            <button
              type="button"
              class="fuel-upd-row__del"
              title="Remove"
              (click)="removeItem(item.id)"
            >
              ×
            </button>
          </div>
        }
      </div>
    </div>

    <footer class="fuel-upd-modal__foot">
      <button type="button" class="btn btn-secondary" (click)="clearAll()">Reset</button>
      <button type="button" class="btn btn-secondary" (click)="cancel()">Cancel</button>
      <button type="button" class="btn btn-primary" (click)="save()">Save</button>
    </footer>
  </div>
</div>
